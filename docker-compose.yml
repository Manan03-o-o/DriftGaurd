version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driftguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./driftguard.db
    volumes:
      - backend-artifacts:/app/artifacts
      - backend-data:/data
    networks:
      - driftguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driftguard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - driftguard-net

networks:
  driftguard-net:
    driver: bridge

volumes:
  backend-artifacts:
  backend-data:
